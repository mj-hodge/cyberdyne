# ─────────────────────────────────────────────
# Model Configuration
# Change the model for any phase here.
# Agents MUST use the model listed — no autonomous overrides.
# ─────────────────────────────────────────────
models:
  default: claude-sonnet-4-6
  phases:
    phase-1: claude-sonnet-4-6
    phase-2: claude-sonnet-4-6
    phase-3: claude-sonnet-4-6
    phase-4: claude-sonnet-4-6
    phase-5: claude-sonnet-4-6
    phase-6: claude-sonnet-4-6

# ─────────────────────────────────────────────
# Slack Configuration
# Credentials are read from environment variables — do NOT put them here.
#   SLACK_WEBHOOK_URL   Incoming webhook URL for your Slack channel
#   SLACK_CHANNEL       (Optional) Override the webhook's default channel e.g. #dev-notifications
# ─────────────────────────────────────────────
slack:
  channel: ""  # Optional static override — leave empty to use SLACK_CHANNEL env var or webhook default

# ─────────────────────────────────────────────
# Asana Configuration
# Credentials are read from environment variables — do NOT put them here.
#   ASANA_TOKEN         Personal access token from https://app.asana.com/0/my-apps
#   ASANA_WORKSPACE_GID Workspace GID (visible in any Asana URL)
# ─────────────────────────────────────────────

# ─────────────────────────────────────────────
# Phase Behavior
# ─────────────────────────────────────────────
phases:
  pause_seconds: 90  # Seconds to wait after Slack notification before auto-advancing
